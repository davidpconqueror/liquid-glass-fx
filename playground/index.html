<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass FX — Interactive Optical Playground</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #090d16;
        color: #f8fafc;
        min-height: 100vh;
        overflow-x: hidden;
      }
      body.light {
        background: #f1f5f9;
        color: #0f172a;
      }
      /* Clean custom scrollbars with track margins */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
        margin: 8px 0;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.55);
      }
      body.light ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.22);
      }
      body.light ::-webkit-scrollbar-thumb:hover {
        background: rgba(14, 165, 233, 0.65);
      }
      .glass-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
      }
      body.light .glass-scrollbar {
        scrollbar-color: rgba(0, 0, 0, 0.22) transparent;
      }
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, -45px) scale(1.12); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-55px, 45px) scale(0.92); }
      }
      @keyframes floatOrb3 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(45px, 50px) scale(1.15); }
      }
      .anim-orb-1 {
        animation: floatOrb1 18s ease-in-out infinite;
      }
      .anim-orb-2 {
        animation: floatOrb2 22s ease-in-out infinite;
      }
      .anim-orb-3 {
        animation: floatOrb3 15s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
